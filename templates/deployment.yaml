apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "Always" 
      restartPolicy: Always
      containers:
        - name: {{ .Release.Name }}
          image: christiannolte/airrohrgateway:latest
          imagePullPolicy: Always
          env:
            - name: url
              value: {{ .Values.url }}
            - name: topic
              value: {{ .Values.topic }}
